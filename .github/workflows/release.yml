# A tag v1.2.3 becomes a GitHub Release carrying linux/amd64 and linux/arm64
# binaries plus checksums. Nodes do not watch this: the control plane pins
# the version each region should run (php artisan probe:release), and the
# node's updater asks it (scripts/sentinel-probe-update.sh).
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Newest 1.26 patch at build time, never the floor go.mod names: the
      # 1.5.5 release was built with go1.26.0 in late October and shipped
      # without eight months of crypto/tls, net/http and x509 fixes.
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          check-latest: true
      - run: go vet ./... && go test ./...
      - name: build
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags="-s -w -X main.version=$VERSION" -o "dist/sentinel-probe_${VERSION}_linux_${arch}" ./cmd/sentinel-probe
          done
          (cd dist && sha256sum * > checksums.txt && cat checksums.txt)
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
